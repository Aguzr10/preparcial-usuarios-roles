# NO TOCAR · Cambiar usuario, contraseña, puerto o volumen deja la base sin acceso.
services:
  postgres:
    image: postgres:17-alpine
    container_name: usuarios_roles_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - usuarios_roles_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  usuarios_roles_data:
